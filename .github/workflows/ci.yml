name: Verify packages
on: [push, pull_request]
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        react: [18.3.1, 19.3.1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:boundaries
      - run: npm install --no-save --package-lock=false --workspaces=false react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/check-hooks.mjs
  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:packages
      - run: npm run build:examples
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build:webpack -w @kinstate/example-next
      - run: npm run test:browser -- --grep Next.js
      - run: npm run test:load
      - run: npm run bench:test
      - run: npm run bench:typecheck
      - run: npm run bench:smoke
      - run: npm audit --audit-level=high
